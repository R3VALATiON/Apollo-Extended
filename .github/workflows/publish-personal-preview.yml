name: Publish Initial Personal Preview
on:
  workflow_dispatch:
  push:
    branches: [agent/controller-emulation-negotiation]
    paths: [.github/workflows/publish-personal-preview.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-initial-personal-preview
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '41237024163'
      SOURCE_SHA: '5a4198ab9fe108c4cf569308270306e6ce13f0bf'
      RELEASE_TAG: 'v0.2.0-personal-preview.1'
    steps:
      - uses: actions/checkout@v4
      - name: Require successful build of the exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$SOURCE_RUN --jq .head_sha)" = "$SOURCE_SHA"
          gh run watch "$SOURCE_RUN" --exit-status --interval 30
          test "$(gh api repos/$GH_REPO/actions/runs/$SOURCE_RUN --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '41237024163'
          name: UNOFFICIAL-Personal-Development-Testing-Apollo-Windows-x64
          path: incoming
      - name: Prepare release binary, notices and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          mapfile -t binaries < <(find incoming -type f -path '*/cpack_artifacts/Apollo-Personal-Development-Testing-0.2.0-preview.1-Windows-x64.exe')
          test "${#binaries[@]}" -eq 1
          cp "${binaries[0]}" release/Apollo-Personal-Development-Testing-0.2.0-preview.1-Windows-x64.exe
          for notice in BUILD_NOTICE.md BUILD_NOTES.md PERSONAL_BUILD_INFO.md; do
            mapfile -t matches < <(find incoming -type f -name "$notice")
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "release/$notice"
          done
          cat > release/BUILD_NOTES.md <<'NOTES'
          # Apollo Windows — 0.2.0 Personal Testing Preview 1
          
          UNOFFICIAL PERSONAL DEVELOPMENT / TESTING BUILD — R3VALATiON.
          Independent experimental fork; not an official upstream release.
          
          Native-feedback policy tests, installer PowerShell syntax validation,
          full Windows compilation and NSIS packaging passed for source
          5a4198ab9fe108c4cf569308270306e6ce13f0bf.
          
          Build: https://github.com/R3VALATiON/Apollo-Extended/actions/runs/41237024163
          
          Physical controller behavior, Windows driver installation, upgrades,
          game recognition and network-quality adaptation remain unverified
          on real hardware. See CHANGELOG.md and BUILD_NOTICE.md for scope.
          NOTES
          cp releases/v0.2.0-personal-preview.1.md release/CHANGELOG.md
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Publish unofficial prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published binaries."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --target "$SOURCE_SHA" \
            --title "Apollo 0.2.0 Preview 1 — Unofficial Personal Development & Testing" \
            --prerelease --latest=false \
            --notes-file "releases/v0.2.0-personal-preview.1.md"
